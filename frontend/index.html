<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookinger – Hotel Kong Arthur</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Hotel Kong Arthur</h1>
      <nav>
        <a href="index.html" aria-current="page">Bookinger</a>
        <a href="analytics.html">Nøgletal</a>
      </nav>
    </header>

    <main>
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Ny booking</h2>
        <form id="booking-form" novalidate>
          <fieldset>
            <legend>Gæst</legend>
            <label>Fornavn <input name="firstName" required maxlength="100" /></label>
            <label>Efternavn <input name="familyName" required maxlength="100" /></label>
            <label>Land <input name="country" required maxlength="100" /></label>
          </fieldset>
          <fieldset>
            <legend>Ophold</legend>
            <label>Værelsestype <select name="roomType" required></select></label>
            <label>Indtjekning <input name="checkIn" type="date" required /></label>
            <label>Udtjekning <input name="checkOut" type="date" required /></label>
            <label>Personer <input name="guests" type="number" min="1" max="4" value="1" required /></label>
          </fieldset>
          <fieldset>
            <legend>Valgfrit</legend>
            <label>
              Manuel pris (DKK)
              <input name="price" type="number" min="0" step="0.01" placeholder="Beregnes automatisk" />
            </label>
            <label>
              Tilfredshed
              <select name="satisfaction">
                <option value="">Ikke besvaret</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
              </select>
            </label>
          </fieldset>

          <div id="form-errors" class="message error" role="alert" hidden></div>
          <div class="actions">
            <button type="submit" id="submit-button">Opret booking</button>
            <button type="button" id="cancel-edit" class="secondary" hidden>Annullér redigering</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <h2 id="list-title">Bookinger</h2>
        <form id="filters" class="filters">
          <label>År <input name="year" type="number" min="2000" max="2100" value="2026" /></label>
          <label>Værelsestype <select name="roomType"><option value="">Alle</option></select></label>
          <label>
            Sæson
            <select name="season">
              <option value="">Alle</option>
              <option value="low">Lav</option>
              <option value="mid">Mellem</option>
              <option value="high">Høj</option>
            </select>
          </label>
          <label>Land <input name="country" placeholder="Alle" /></label>
          <button type="submit">Filtrér</button>
        </form>

        <div id="list-message" class="message" role="status"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Id</th>
                <th>Gæst</th>
                <th>Land</th>
                <th>Type</th>
                <th>Værelse</th>
                <th>Ind</th>
                <th>Ud</th>
                <th class="num">Nætter</th>
                <th class="num">Pers.</th>
                <th>Sæson</th>
                <th class="num">Pris (DKK)</th>
                <th class="num">Tilfr.</th>
                <th><span class="visually-hidden">Handlinger</span></th>
              </tr>
            </thead>
            <tbody id="booking-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="js/bookings.js"></script>
  </body>
</html>
