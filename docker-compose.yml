name: hotel-kong-arthur

# Alle værdier har defaults, så et frisk clone starter uden en .env-fil (NFR-015).
x-backend-env: &backend-env
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:-hotel}
  DB_PASSWORD: ${DB_PASSWORD:-hotel}
  DB_NAME: ${DB_NAME:-hotel_kong_arthur}
  PORT: 3000
  DATA_DIR: /app/data
  OPENAPI_PATH: /app/openapi.yaml

x-backend-mounts: &backend-mounts
  - ./hotel_bookings_2026.csv:/app/data/hotel_bookings_2026.csv:ro
  - ./drinks_menu_with_sales.csv:/app/data/drinks_menu_with_sales.csv:ro
  - ./api/openapi.yaml:/app/openapi.yaml:ro

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-hotel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotel}
      POSTGRES_DB: ${DB_NAME:-hotel_kong_arthur}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP frem for socket: PostgreSQLs midlertidige init-server lytter kun på socket,
      # så uden -h 127.0.0.1 ville den melde healthy, før den rigtige server er oppe.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - hotel-net

  backend:
    build:
      context: ./backend
      target: runtime
    environment: *backend-env
    ports:
      - "${PORT:-3000}:3000"
    volumes: *backend-mounts
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - hotel-net

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hotel-net

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    ports:
      - "8081:8080"
    volumes:
      - ./api:/spec:ro
    networks:
      - hotel-net

  wdc-build:
    build: ./tableau-connector
    volumes:
      - ./tableau-connector/dist:/output
    restart: "no"
    networks:
      - hotel-net

  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      <<: *backend-env
      DB_USER: hotel_test
      DB_PASSWORD: hotel_test
      DB_NAME: hotel_kong_arthur_test
      NODE_ENV: test
    volumes: *backend-mounts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-net

volumes:
  pg-data:

networks:
  hotel-net:
    driver: bridge
